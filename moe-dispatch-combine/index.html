<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="在可缩放画布上逐层探索 MoE 路由、Dispatch、专家计算与 Combine。点击模块查看真实形状的矩阵、任务记录和加权结果。">
  <title>MoE Explainer · Dispatch & Combine</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fff'/%3E%3Cpath d='M11 20h14l12 12-12 12H11M53 20H39L27 32l12 12h14' fill='none' stroke='%236464e9' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./model.js"></script>
  <script defer src="./details.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#scene">跳到 MoE 画布</a>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-glyph" aria-hidden="true">M<span>⇄</span>E</span><strong>MoE EXPLAINER</strong></div>
      <div class="top-controls" role="group" aria-label="模型与播放控制">
        <label class="select-control"><span>规模</span><select id="preset"><option value="ep8">EP8 · 128 token</option><option value="ep64">EP64 · 1024 token</option></select></label>
        <label class="select-control"><span>路由</span><select id="scenario"><option value="balanced">分散</option><option value="hotspot">E2 热点</option></select></label>
        <label class="select-control compact"><span>Top-k</span><select id="topk"><option value="2">2</option><option value="4" selected>4</option><option value="8">8</option></select></label>
        <div class="play-controls"><button id="previous" class="control-button" type="button" aria-label="上一阶段" title="上一阶段">‹</button><button id="play" class="play-button" type="button" aria-label="播放">▶ <span>播放</span></button><button id="next" class="control-button" type="button" aria-label="下一阶段" title="下一阶段">›</button></div>
        <label class="select-control compact speed"><span>速度</span><select id="speed"><option value="0.6">0.6×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label>
      </div>
      <button id="about" class="about-button" type="button" aria-label="查看模型来源与边界" title="模型来源与边界">?</button>
    </header>

    <div class="stagebar" role="group" aria-label="过程阶段">
      <div class="stage-buttons" id="stage-buttons">
        <button type="button" data-phase="0"><span>01</span>输入</button>
        <button type="button" data-phase="1"><span>02</span>路由</button>
        <button type="button" data-phase="2"><span>03</span>Dispatch</button>
        <button type="button" data-phase="3"><span>04</span>专家</button>
        <button type="button" data-phase="4"><span>05</span>Combine</button>
        <button type="button" data-phase="5"><span>06</span>输出</button>
      </div>
      <label class="scrub-wrap"><span class="sr-only">过程进度</span><input id="scrub" type="range" min="0" max="600" value="0" aria-label="过程进度"></label>
    </div>

    <main class="canvas-shell" id="canvas-shell">
      <svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1740 830" role="img" aria-label="可缩放的 MoE 输入、路由、Dispatch、专家、Combine 与输出画布" tabindex="0"></svg>
      <div class="canvas-metrics" aria-label="当前模型统计">
        <span id="metric-tokens">128 token</span><span id="metric-tasks">512 专家任务</span><span id="metric-cross">跨 rank 453</span><span id="metric-bytes">单向 3.5 MiB</span>
      </div>
      <div class="canvas-tools" role="group" aria-label="画布缩放控制"><button id="zoom-in" type="button" aria-label="放大">＋</button><button id="zoom-out" type="button" aria-label="缩小">－</button><button id="fit" type="button" aria-label="适配画布">⌗</button></div>
      <div class="canvas-hint">滚轮缩放 · 拖动画布 · 点击模块展开</div>
    </main>
  </div>

  <div id="detail-layer" class="detail-layer" hidden>
    <div id="detail-backdrop" class="detail-backdrop"></div>
    <section class="detail-dialog" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <header class="detail-header"><div><span id="detail-number" class="detail-number"></span><h2 id="detail-title"></h2><span id="detail-shape" class="detail-shape"></span></div><div class="detail-head-actions"><button id="detail-prev" type="button" aria-label="上一个模块">←</button><button id="detail-next" type="button" aria-label="下一个模块">→</button><button id="detail-close" type="button" aria-label="关闭详情">×</button></div></header>
      <div id="detail-subnav" class="detail-subnav" role="tablist" aria-label="模块内部步骤"></div>
      <div id="detail-controls" class="detail-controls"></div>
      <div id="detail-body" class="detail-body"></div>
      <footer class="detail-footer"><span id="detail-status"></span><button id="detail-advance" type="button">下一小节 →</button></footer>
    </section>
  </div>
</body>
</html>
